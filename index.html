<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simple</title>
  </head>
  <body>
    <header>
      <div class="header-wrapper">
        <div class="logo">
          <img src="images/logo.svg" alt="logo" />
        </div>
        <div class="nav">
          <h1>Продукция</h1>
          <h1>Материалы</h1>
          <h1>О нас</h1>
          <h1>Контакты</h1>
          <div class="icons">
            <img src="images/search.svg" alt="search" />
            <img src="images/log_in.svg" alt="log_in" />
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="main-wrapper">
        <div class="text-container">
          <h1>Простые вещи. Из бумаги</h1>
          <p>
            Бума́га (предположительно от итал. bombagia, первоисточником же
            считается иранский) — волокнистый материал с минеральными добавками.
          </p>
          <button>Каталог</button>
        </div>
        <div class="img-container">
          <img src="images/mainPhoto.png" alt="mainPhoto" />
        </div>
      </div>
    </main>
  </body>
</html>
